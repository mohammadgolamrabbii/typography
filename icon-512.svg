<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square App Shell -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />
  
  <!-- Neon Accent Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#glowGrad)" stroke-width="8" opacity="0.4" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-dasharray="12 12" opacity="0.6" />
  
  <!-- Central Globe & Typography Symbol -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="110" fill="none" stroke="#10b981" stroke-width="10" />
    <!-- Latitude & Longitude Lines -->
    <ellipse cx="256" cy="256" rx="55" ry="110" fill="none" stroke="#06b6d4" stroke-width="6" />
    <line x1="146" y1="256" x2="366" y2="256" stroke="#06b6d4" stroke-width="6" />
    <line x1="165" y1="200" x2="347" y2="200" stroke="#06b6d4" stroke-width="4" stroke-dasharray="6 6" />
    <line x1="165" y1="312" x2="347" y2="312" stroke="#06b6d4" stroke-width="4" stroke-dasharray="6 6" />
  </g>
  
  <!-- Prominent Open "T" Letterform Monogram in Center -->
  <path d="M 216 195 L 296 195 M 256 195 L 256 317" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Mini Script Badges -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#10b981" text-anchor="middle" letter-spacing="4">80,200+ FONTS</text>
  <text x="256" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="2">OPEN TYPOGRAPHY FOUNDATION</text>
</svg>
